# Build dual CPA plugins (freebuff + codebuff) and publish GitHub Releases
# for CLIProxyAPI-Plugins-Store layout.
#
# Tag: vX.Y.Z
# Assets per platform:
#   freebuff_<ver>_<goos>_<goarch>.zip   → freebuff.<ext> at zip root
#   codebuff_<ver>_<goos>_<goarch>.zip   → codebuff.<ext> at zip root
#   checksums.txt
#
# freebuff.*  auth.identifier=freebuff  (Freebuff OAuth + executor)
# codebuff.*  auth.identifier=codebuff  (Codebuff OAuth; chat via freebuff)

name: Build

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_PKG: github.com/WslzGmzs/freebuff2api/plugin.PluginVer
  IDENTITY_PKG: github.com/WslzGmzs/freebuff2api/plugin.Identity

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "EXT=${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "GOOS_V=${{ matrix.goos }}" >> "${GITHUB_ENV}"
          echo "GOARCH_V=${{ matrix.goarch }}" >> "${GITHUB_ENV}"

      - name: Build freebuff + codebuff shared libraries
        run: |
          set -euo pipefail
          mkdir -p dist
          for ID in freebuff codebuff; do
            CGO_ENABLED=1 GOOS="${GOOS_V}" GOARCH="${GOARCH_V}" \
              go build -trimpath -buildmode=c-shared \
                -ldflags "-s -w -X ${VERSION_PKG}=${VERSION} -X ${IDENTITY_PKG}=${ID}" \
                -o "dist/${ID}.${EXT}" .
            rm -f "dist/${ID}.h"
          done

      - name: Package plugins
        run: |
          set -euo pipefail
          for ID in freebuff codebuff; do
            ARCHIVE="${ID}_${VERSION}_${GOOS_V}_${GOARCH_V}.zip"
            go run ./.github/scripts/package-release.go \
              -library "dist/${ID}.${EXT}" \
              -archive "${ARCHIVE}" \
              -checksum "${ARCHIVE}.sha256"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            freebuff_*.zip
            freebuff_*.zip.sha256
            codebuff_*.zip
            codebuff_*.zip.sha256
          if-no-files-found: error

  build-windows-arm64:
    name: Build windows/arm64
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build freebuff windows/arm64
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: windows-arm64
          out-dir: dist/windows-arm64-freebuff
          output: freebuff.dll
          flags: -ldflags=-s -w
          x-flags: |
            github.com/WslzGmzs/freebuff2api/plugin.PluginVer=${{ steps.release_metadata.outputs.version }}
            github.com/WslzGmzs/freebuff2api/plugin.Identity=freebuff

      - name: Build codebuff windows/arm64
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: windows-arm64
          out-dir: dist/windows-arm64-codebuff
          output: codebuff.dll
          flags: -ldflags=-s -w
          x-flags: |
            github.com/WslzGmzs/freebuff2api/plugin.PluginVer=${{ steps.release_metadata.outputs.version }}
            github.com/WslzGmzs/freebuff2api/plugin.Identity=codebuff

      - name: Package plugins
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h dist/windows-arm64-freebuff/*.h dist/windows-arm64-codebuff/*.h
          for ID in freebuff codebuff; do
            ARCHIVE="${ID}_${VERSION}_windows_arm64.zip"
            go run ./.github/scripts/package-release.go \
              -library "dist/windows-arm64-${ID}/${ID}.dll" \
              -archive "${ARCHIVE}" \
              -checksum "${ARCHIVE}.sha256"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins_windows_arm64
          path: |
            freebuff_*.zip
            freebuff_*.zip.sha256
            codebuff_*.zip
            codebuff_*.zip.sha256
          if-no-files-found: error

  build-freebsd:
    name: Build freebsd/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install FreeBSD cross-build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld wget

      - name: Build freebuff freebsd
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: freebsd-${{ matrix.goarch }}
          out-dir: dist/freebsd-freebuff
          output: freebuff.so
          flags: -ldflags=-s -w
          x-flags: |
            github.com/WslzGmzs/freebuff2api/plugin.PluginVer=${{ steps.release_metadata.outputs.version }}
            github.com/WslzGmzs/freebuff2api/plugin.Identity=freebuff

      - name: Build codebuff freebsd
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: freebsd-${{ matrix.goarch }}
          out-dir: dist/freebsd-codebuff
          output: codebuff.so
          flags: -ldflags=-s -w
          x-flags: |
            github.com/WslzGmzs/freebuff2api/plugin.PluginVer=${{ steps.release_metadata.outputs.version }}
            github.com/WslzGmzs/freebuff2api/plugin.Identity=codebuff

      - name: Package plugins
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h dist/freebsd-freebuff/*.h dist/freebsd-codebuff/*.h
          for ID in freebuff codebuff; do
            ARCHIVE="${ID}_${VERSION}_freebsd_${{ matrix.goarch }}.zip"
            go run ./.github/scripts/package-release.go \
              -library "dist/freebsd-${ID}/${ID}.so" \
              -archive "${ARCHIVE}" \
              -checksum "${ARCHIVE}.sha256"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins_freebsd_${{ matrix.goarch }}
          path: |
            freebuff_*.zip
            freebuff_*.zip.sha256
            codebuff_*.zip
            codebuff_*.zip.sha256
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - build-windows-arm64
      - build-freebsd
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          find dist -name '*.sha256' -print0 | xargs -0 cat | sort > dist/checksums.txt
          mapfile -t ZIPS < <(find dist -name '*.zip' | sort)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ZIPS[@]}" dist/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "${ZIPS[@]}" dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
