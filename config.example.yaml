plugins:
  enabled: true
  dir: "plugins"
  configs:
    # Freebuff OAuth + models + chat executor (required)
    freebuff:
      enabled: true
      priority: 100
      debug: false
    # Codebuff OAuth entry on /oauth (optional but recommended)
    # Install codebuff.<dll|so|dylib> next to freebuff.*
    codebuff:
      enabled: true
      priority: 99

api-keys:
  - "sk-local"
